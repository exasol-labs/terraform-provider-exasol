name: CI

on:
  push:
    branches: [ main, develop ]
    tags-ignore:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # Only run on pushes and PRs from the same repository (not forks)
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run fmt
        run: make fmt

      - name: Run vet
        run: make vet

      - name: Run tests
        run: make test

      - name: Build
        run: make build

      # Fails on known vulnerabilities that the provider code can reach, in
      # dependencies and in the Go version from go.mod. Release depends on
      # this job. A new Go advisory turns CI red until go.mod is bumped.
      # Checked per GOOS that goreleaser ships; installed first because
      # `GOOS=x go run` would cross-compile govulncheck itself.
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          for os in linux windows darwin freebsd; do
            echo "== GOOS=$os"
            GOOS=$os "$(go env GOPATH)/bin/govulncheck" ./...
          done

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Validate docs
        run: make docs-validate

      - name: Upload coverage reports
        uses: codecov/codecov-action@v6
        if: success()

  lint:
    name: Lint
    runs-on: ubuntu-latest
    # Only run on pushes and PRs from the same repository (not forks)
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  build-and-release:
    name: Build & Release
    needs: [test, lint]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check if release needed
        id: check
        run: |
          ver=$(grep -Po 'var version\s*=\s*"\K[0-9]+\.[0-9]+\.[0-9]+' main.go)
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          if gh release view "v$ver" &>/dev/null; then
            echo "Release v$ver already exists, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "New version v$ver detected, proceeding with release"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v6
        if: steps.check.outputs.skip == 'false'
        with:
          go-version-file: go.mod

      - name: Create tag
        if: steps.check.outputs.skip == 'false'
        run: |
          ver=${{ steps.check.outputs.version }}
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "v$ver" -m "Release v$ver"
          git push origin "v$ver"

      - name: Extract release notes from CHANGELOG.md
        if: steps.check.outputs.skip == 'false'
        run: |
          ver=${{ steps.check.outputs.version }}
          awk "/^## \\[${ver}\\]/{found=1; next} /^## \\[/{if(found) exit} found" CHANGELOG.md > /tmp/release-notes.md

      # GPG signing is required by the Terraform Registry (SHA256SUMS.sig).
      # Tagging and releasing happen in this single job, so we never rely on a
      # tag push triggering another workflow (GITHUB_TOKEN-pushed tags do not
      # trigger workflows). The fingerprint feeds goreleaser's signs block.
      - name: Import GPG key
        id: import_gpg
        if: steps.check.outputs.skip == 'false'
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6.3.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Run goreleaser
        if: steps.check.outputs.skip == 'false'
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: '~> v2'
          args: release --clean --release-notes /tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
